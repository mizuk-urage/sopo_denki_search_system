<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF922B">
  <title>アプリを更新中</title>
  <style>body{margin:0;padding:48px 22px;background:#F5F8FA;color:#141A20;font-family:system-ui,sans-serif}.box{max-width:430px;margin:auto;padding:24px;border:1px solid #CDD8DE;border-radius:16px;background:#fff}h1{margin:0 0 12px;font-size:1.25rem}p{line-height:1.7}.note{color:#52616C;font-size:.9rem}</style>
</head>
<body>
  <main class="box">
    <h1>アプリを更新しています</h1>
    <p id="status">古い画面の保存を入れ替えています…</p>
    <p class="note">登録済みの資料と企画情報は削除しません。</p>
  </main>
  <script>
    (async () => {
      const status=document.querySelector("#status");
      try {
        const registrations=await navigator.serviceWorker?.getRegistrations() || [];
        await Promise.all(registrations.map(registration=>registration.unregister()));
        const keys=await caches.keys();
        await Promise.all(keys.filter(key=>key.startsWith("festival-search-")).map(key=>caches.delete(key)));
        status.textContent="更新しました。検索画面を開きます…";
        location.replace("search.html?recovered=1");
      } catch (error) {
        status.textContent="更新できませんでした。通信を確認して、もう一度このページを開いてください。";
      }
    })();
  </script>
</body>
</html>
